function escHtml(s) {
  if (s === null || s === undefined) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderLinkCell(link) {
  if (!link) return "-";
  const href = link.startsWith("http") ? link : ("https://" + link);
  return `<a class="link-btn" href="${escHtml(href)}" target="_blank">投递</a>`;
}

function cellHtml(col, row) {
  const v = row[col.key];
  if (col.type === "link") return renderLinkCell(v);
  if (col.type === "badge") return v ? `<span class="badge">${escHtml(v)}</span>` : "-";

  }
  return escHtml(v || "");
}

      const tds = COLUMNS.map(c => {
        const cls = c.key === "备注" ? ' class="notes"'
          : c.key === "招聘岗位" ? ' class="pos"'
          : c.key === "工作地点" ? ' class="loc"'
          : c.key === "行业" ? ' class="ind"'
          : "";
        return `<td${cls}>${cellHtml(c, row)}</td>`;
      }).join("");
      return `<tr>${tds}</tr>`;
    }).join("");
  }
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  document.getElementById("pageInfo").textContent = `第 ${currentPage + 1} / ${totalPages} 页`;
  document.getElementById("prevBtn").disabled = currentPage <= 0;
  document.getElementById("nextBtn").disabled = currentPage >= totalPages - 1;
  document.getElementById("statText").textContent = `共 ${filtered.length} 条（总计 ${ROWS.length} 条）`;
}

function applyFilter() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const filterEls = [...document.querySelectorAll(".colFilter")];
  filtered = ROWS.filter(r => {
    if (q && !JSON.stringify(r).toLowerCase().includes(q)) return false;
    for (const el of filterEls) {
      const col = COLUMNS.find(c => c.key === el.dataset.key);
      if (col && !matchColumnFilter(r, col, el.value)) return false;
    }
    return true;
  });
  currentPage = 0;
  renderPage();
}

function clearAllFilters() {
  document.getElementById("searchBox").value = "";
  document.querySelectorAll(".colFilter").forEach(el => { el.value = ""; });
  applyFilter();
}

document.getElementById("searchBox").addEventListener("input", applyFilter);
document.getElementById("clearFiltersBtn").addEventListener("click", clearAllFilters);
document.getElementById("prevBtn").addEventListener("click", () => { if (currentPage > 0) { currentPage--; renderPage(); } });
document.getElementById("nextBtn").addEventListener("click", () => {
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (currentPage < totalPages - 1) { currentPage++; renderPage(); }
});

renderHead();
renderFilterRow();
renderPage();
</script>
</body>
</html>
